<!doctype html><html><head><title>Two Simple Toasts</title></head><body><main><h1>Two Simple Toasts</h1><h2>Ingredients — Olive Toast</h2><ul><li>1 slice bread</li><li>1 tsp olive oil</li></ul><h2>Instructions</h2><ol><li>Toast the bread.</li><li>Drizzle with oil.</li></ol><h2>Ingredients — Jam Toast</h2><ul><li>1 slice bread</li><li>2 tsp berry jam</li></ul><h2>Instructions</h2><ol><li>Toast the bread.</li><li>Spread with jam.</li></ol></main></body></html>
